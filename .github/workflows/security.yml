name: Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security checks daily at 3 AM UTC
    - cron: '0 3 * * *'

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install bandit safety

    - name: Run Bandit security scan
      run: |
        bandit -r src -ll -f json -o bandit-report.json || true
        bandit -r src -ll || true

    - name: Check dependencies for known vulnerabilities
      run: |
        safety check || true

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
        retention-days: 30

    - name: Comment PR with security results
      # Forked PRs get a read-only token, so never fail the job over a comment
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
            const issues = report.results;
            if (issues.length > 0) {
              const comment = `**Bandit security scan found ${issues.length} issue(s)**\n\n${issues.map(i => `- [${i.issue_severity}] ${i.test_id}: ${i.issue_text} (${i.filename}:${i.line_number})`).join('\n')}`;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          } catch (e) {
            console.log('No security issues found');
          }

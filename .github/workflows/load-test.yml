name: Load Testing

on:
  push:
    branches: [ main ]
  schedule:
    # Run load tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  load-test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ratelimiter
          POSTGRES_USER: ratelimiter
          POSTGRES_PASSWORD: ratelimiter
        options: >-
          --health-cmd "pg_isready -U ratelimiter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify services connectivity
      run: |
        python -c "
        import socket
        import time
        import subprocess
        
        def check_service(host, port, name, max_retries=40):
            for i in range(max_retries):
                try:
                    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                    s.settimeout(1)
                    result = s.connect_ex((host, port))
                    s.close()
                    if result == 0:
                        print(f'✓ {name} ({host}:{port}) is ready')
                        return True
                except Exception as e:
                    pass
                if i % 10 == 0:
                    print(f'  Waiting for {name}... ({i}s)')
                time.sleep(1)
            print(f'✗ {name} ({host}:{port}) failed to start')
            return False
        
        # Check basic port connectivity
        redis_ok = check_service('localhost', 6379, 'Redis')
        postgres_ok = check_service('localhost', 5432, 'PostgreSQL')
        
        if not postgres_ok:
            exit(1)
        
        # Test PostgreSQL connection with psycopg2
        print('Testing PostgreSQL connection...')
        try:
            import psycopg2
            for i in range(20):
                try:
                    conn = psycopg2.connect(
                        host='localhost',
                        port=5432,
                        user='ratelimiter',
                        password='ratelimiter',
                        database='ratelimiter'
                    )
                    conn.close()
                    print('✓ PostgreSQL is accepting connections')
                    exit(0)
                except psycopg2.OperationalError as e:
                    if i < 19:
                        print(f'  PostgreSQL not ready, retrying... ({i+1}/20)')
                        time.sleep(1)
                    else:
                        print(f'✗ PostgreSQL connection failed: {e}')
                        exit(1)
        except ImportError:
            print('psycopg2 not available, skipping detailed check')
            exit(0 if postgres_ok and redis_ok else 1)
        "

    - name: Start FastAPI application
      run: |
        nohup python -u -m uvicorn src.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
        sleep 2
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        DATABASE_URL: postgresql://ratelimiter:ratelimiter@localhost:5432/ratelimiter
        PYTHONUNBUFFERED: 1

    - name: Check application logs and process
      run: |
        echo "=== Uvicorn startup logs (first 50 lines) ==="
        head -50 /tmp/uvicorn.log || echo "No logs yet"
        echo ""
        echo "=== Running processes ==="
        ps aux | grep -E 'uvicorn|python' | grep -v grep || echo "No matching processes"
        sleep 1

    - name: Wait for application ready
      run: |
        python -c "
        import socket
        import time
        import sys
        
        print('Waiting for application on port 8000...')
        for i in range(40):
            try:
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.settimeout(1)
                result = s.connect_ex(('localhost', 8000))
                s.close()
                if result == 0:
                    print(f'✓ Application is ready on port 8000 (attempt {i+1})')
                    sys.exit(0)
            except Exception as e:
                pass
            if i % 10 == 0:
                print(f'  Waiting... ({i+1}/40 seconds)')
            time.sleep(1)
        
        print('✗ Application failed to respond on port 8000')
        print('Last log entries:')
        import subprocess
        subprocess.run(['tail', '-20', '/tmp/uvicorn.log'])
        sys.exit(1)
        "

    - name: Run load tests with Locust
      run: |
        pytest tests/load_test.py -v --tb=short || true
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        DATABASE_URL: postgresql://ratelimiter:ratelimiter@localhost:5432/ratelimiter

    - name: Upload load test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-results
        path: load-test-*.html
        retention-days: 30

name: Load Testing

on:
  push:
    branches: [ main ]
  schedule:
    # Run load tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  load-test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ratelimiter
          POSTGRES_USER: ratelimiter
          POSTGRES_PASSWORD: ratelimiter
        options: >-
          --health-cmd "pg_isready -U ratelimiter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify services connectivity
      run: |
        python -c "
        import socket
        import time
        
        def check_service(host, port, name, max_retries=30):
            for i in range(max_retries):
                try:
                    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                    s.settimeout(1)
                    result = s.connect_ex((host, port))
                    s.close()
                    if result == 0:
                        print(f'✓ {name} ({host}:{port}) is ready')
                        return True
                except Exception as e:
                    pass
                time.sleep(1)
            print(f'✗ {name} ({host}:{port}) failed to start')
            return False
        
        all_ready = all([
            check_service('localhost', 6379, 'Redis'),
            check_service('localhost', 5432, 'PostgreSQL'),
        ])
        exit(0 if all_ready else 1)
        "

    - name: Start FastAPI application
      run: |
        nohup python -u -m uvicorn src.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
        sleep 3
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        DATABASE_URL: postgresql://ratelimiter:ratelimiter@localhost:5432/ratelimiter
        PYTHONUNBUFFERED: 1

    - name: Check application startup
      run: |
        cat /tmp/uvicorn.log || echo "No uvicorn log found"
        sleep 2
        python -c "
        import socket
        import time
        
        for i in range(30):
            try:
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.settimeout(1)
                result = s.connect_ex(('localhost', 8000))
                s.close()
                if result == 0:
                    print('✓ Application is ready on port 8000')
                    exit(0)
            except Exception as e:
                pass
            time.sleep(1)
        print('✗ Application failed to start')
        exit(1)
        "

    - name: Run load tests with Locust
      run: |
        pytest tests/load_test.py -v --tb=short || true
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        DATABASE_URL: postgresql://ratelimiter:ratelimiter@localhost:5432/ratelimiter

    - name: Upload load test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-results
        path: load-test-*.html
        retention-days: 30

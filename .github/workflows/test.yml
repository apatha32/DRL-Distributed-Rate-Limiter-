name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ratelimiter
          POSTGRES_USER: ratelimiter
          POSTGRES_PASSWORD: ratelimiter
        options: >-
          --health-cmd "pg_isready -U ratelimiter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      jaeger:
        image: jaegertracing/all-in-one:latest
        ports:
          - 6831:6831/udp
          - 16686:16686

    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for services
      run: |
        pip install psycopg2-binary
        python -c "
        import time
        import socket
        import sys
        
        def wait_for_service(host, port, service_name, max_retries=30):
            for i in range(max_retries):
                try:
                    socket.create_connection((host, port), timeout=1)
                    print(f'✓ {service_name} is ready')
                    return True
                except (socket.timeout, ConnectionRefusedError):
                    time.sleep(1)
            print(f'✗ {service_name} failed to start')
            return False
        
        services_ok = all([
            wait_for_service('localhost', 6379, 'Redis'),
            wait_for_service('localhost', 5432, 'PostgreSQL'),
            wait_for_service('localhost', 16686, 'Jaeger'),
        ])
        sys.exit(0 if services_ok else 1)
        "

    - name: Run unit tests
      run: |
        pytest tests/test_algorithms.py -v --tb=short

    - name: Run integration tests
      run: |
        pytest tests/test_integration.py -v --tb=short
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        DATABASE_URL: postgresql://ratelimiter:ratelimiter@localhost:5432/ratelimiter
        JAEGER_HOST: localhost
        JAEGER_PORT: 6831

    - name: Upload coverage
      if: always()
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ratelimiter
          POSTGRES_USER: ratelimiter
          POSTGRES_PASSWORD: ratelimiter
        options: >-
          --health-cmd "pg_isready -U ratelimiter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      jaeger:
        image: jaegertracing/all-in-one:latest
        ports:
          - 6831:6831/udp
          - 16686:16686

    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for services
      run: |
        python -c "
        import time
        import socket
        import sys
        
        def wait_for_service(host, port, service_name, max_retries=50):
            for i in range(max_retries):
                try:
                    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                    s.settimeout(1)
                    result = s.connect_ex((host, port))
                    s.close()
                    if result == 0:
                        print(f'✓ {service_name} ({host}:{port}) is ready')
                        return True
                except Exception as e:
                    pass
                if i % 10 == 0 and i > 0:
                    print(f'  Still waiting for {service_name}... ({i}s)')
                time.sleep(1)
            print(f'✗ {service_name} ({host}:{port}) failed to start')
            return False
        
        services_ok = all([
            wait_for_service('localhost', 6379, 'Redis'),
            wait_for_service('localhost', 5432, 'PostgreSQL'),
            wait_for_service('localhost', 16686, 'Jaeger'),
        ])
        
        if services_ok:
            # Additional check for PostgreSQL readiness
            try:
                import psycopg2
                for i in range(10):
                    try:
                        conn = psycopg2.connect(
                            host='localhost',
                            port=5432,
                            user='ratelimiter',
                            password='ratelimiter',
                            database='ratelimiter'
                        )
                        conn.close()
                        print('✓ PostgreSQL is accepting connections')
                        services_ok = True
                        break
                    except psycopg2.OperationalError:
                        if i < 9:
                            time.sleep(1)
                        else:
                            print('✗ PostgreSQL connection failed after retries')
                            services_ok = False
            except ImportError:
                print('  (psycopg2 check skipped)')
        
        sys.exit(0 if services_ok else 1)
        "

    - name: Run unit tests
      run: |
        pytest tests/test_algorithms.py -v --tb=short

    - name: Run integration tests
      run: |
        pytest tests/test_integration.py -v --tb=short
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        DATABASE_URL: postgresql://ratelimiter:ratelimiter@localhost:5432/ratelimiter
        JAEGER_HOST: localhost
        JAEGER_PORT: 6831

    - name: Upload coverage
      if: always()
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
